allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.550'
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14
onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild

# pnpm 11 は package.json の pnpm.overrides を読まないので、ここに移した(2026-09-26)。
# 値は ^修正版 にしている(docustation と同じ方式)。exact 版だと、pnpm のセレクタは依存元の宣言範囲
# (^4.0.0 など)と重なるだけで効くため、修正版より新しい版まで押し下げてしまう(rollup 4.62→4.60 等を実測)。
# @babel/plugin-transform-modules-systemjs は package.json で 7.29.4 に exact 固定していたのを、修正版未満だけに効く形にした。
overrides:
  '@babel/plugin-transform-modules-systemjs@<7.29.4': ^7.29.4
  '@wordpress/vips': 1.0.1-next.v.202602200903.0
  ajv@<6.14.0: ^6.14.0
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  defu@<=6.1.4: ^6.1.7
  diff@>=4.0.0 <4.0.4: ^4.0.4
  flatted@<3.4.2: ^3.4.2
  follow-redirects@<1.16.2: ^1.16.2
  handlebars@<=4.7.8: ^4.7.9
  immutable@>=5.0.0 <5.1.5: ^5.1.5
  js-yaml@>=4.0.0 <4.1.1: ^4.1.1
  # @antfu/eslint-config → @eslint/markdown → micromark-extension-math（^0.16）の推移依存。開発用で本番には入らない（Dependabot #94、2026-10-28）
  katex@<0.18.2: ^0.18.2
  lodash@>=4.0.0 <=4.17.23: ^4.18.1
  minimatch@<3.1.4: ^3.1.4
  # minimatch 10 系: GHSA（globparts の増幅による DoS、Dependabot #95、2026-11-01）は 11.0.1 からしか直っていない。
  # ESLint（eslint ^10.2.5・@eslint/config-array ^10.2.4・typescript-estree ^10.2.2）がまだ 10 系を要求するので、
  # 11 系への override はしない（上流待ち）。11 系は 2026-10-27 に出た作り直し版で、新しい依存（@isaacs/nonrecursive-glob-match）も増える。
  # 開発用（lint）で本番には入らず、渡すパターンは自分の設定ファイルのものだけ。ESLint が 11 系に上げたらこのコメントを消す
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  postcss-selector-parser@<7.1.6: ^7.1.6
  postcss@<8.5.10: ^8.5.10
  preact@>=10.28.0 <10.28.2: ^10.28.2
  rollup@>=4.0.0 <4.59.0: ^4.60.2
  source-map-js@<1.2.2: ^1.2.2
  yaml@>=1.0.0 <1.10.3: ^1.10.3
  yaml@>=2.0.0 <2.8.3: ^2.8.3
